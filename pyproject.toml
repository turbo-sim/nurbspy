[tool.poetry]
name = "nurbspy"
version = "1.3.0"
description = "A lightweight library for NURBS curves and surfaces"
authors = ["Roberto Agromayor <rober.agro@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/turbo-sim/nurbspy"
documentation = "https://turbo-sim.github.io/nurbspy/"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
numpy = "^2.3.0"
scipy = "^1.16.1"
matplotlib = "^3.10.6"
PyYAML = "^6.0.2"
toml = "^0.10.2"
cycler = "^0.12.1"
numba = "^0.62.0"

# Optional runtime dependencies for the nurbspy.jax backend.
jax = { version = "^0.6.0", optional = true }
jaxlib = { version = "^0.6.0", optional = true }
equinox = { version = "^0.12.0", optional = true }
diffrax = { version = "^0.7.0", optional = true }
optimistix = { version = "^0.0.10", optional = true }
quadax = { version = "^0.2.10", optional = true }


[tool.poetry.extras]
jax = ["jax", "jaxlib", "equinox", "diffrax", "optimistix", "quadax"]


[tool.poetry.group.dev.dependencies]
ipython = ">=8.13,<8.17"
black = "^25.1.0"
pytest = "^8.3.5"
pyzotero = "^1.5.19"
numpydoc = "^1.7.0"
sphinx = "^7.3.7"
sphinx-tabs = "^3.4.5"
sphinx-book-theme = "^1.1.2"
sphinx-rtd-theme = "^2.0.0"
sphinxcontrib-bibtex = "^2.6.2"
sphinxawesome-theme = "^5.1.5"
sphinx-design = "^0.6.0"
sphinx-togglebutton = "^0.3.2"
pydantic = "^2.7.2"
sphinx-autobuild = "^2024.10.3"
myst-parser = "^4.0.1"
bump-my-version = "^1.5.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


# Rememeber to add --tags when publishing a new version
# git push origin main --tags
