[tool.poetry]
name = "nurbspy"
version = "1.6.0"
description = "A lightweight library for NURBS curves and surfaces"
authors = ["Roberto Agromayor <rober.agro@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/turbo-sim/nurbspy"
documentation = "https://turbo-sim.github.io/nurbspy/"
packages = [{ include = "nurbspy", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
numpy = "^2.3.0"
scipy = "^1.16.1"
matplotlib = "^3.10.6"
PyYAML = "^6.0.2"
toml = "^0.10.2"
cycler = "^0.12.1"

# Optional acceleration for the NumPy backend.
numba = { version = ">=0.62,<1.0", optional = true }

# Optional runtime dependencies for the nurbspy.jax backend.
jax = { version = "^0.12.0.1", optional = true }
jaxlib = { version = "^0.12.0.1", optional = true }
equinox = { version = "^0.13.8", optional = true }
diffrax = { version = "^0.7.2", optional = true }
optimistix = { version = "^0.1.0", optional = true }
quadax = { version = "^0.3.1", optional = true }


[tool.poetry.extras]
numba = ["numba"]
jax = ["jax", "jaxlib", "equinox", "diffrax", "optimistix", "quadax"]


[tool.poetry.group.dev.dependencies]
ipython = ">=8.13,<8.17"
black = "^26.3.1"
pytest = "^9.0.3"
pyzotero = "^1.5.19"
numpydoc = "^1.7.0"
sphinx = "^7.3.7"
sphinx-tabs = "^3.4.5"
sphinx-book-theme = "^1.1.2"
sphinx-rtd-theme = "^2.0.0"
sphinxcontrib-bibtex = "^2.6.2"
sphinxawesome-theme = "^5.1.5"
sphinx-design = "^0.6.0"
sphinx-togglebutton = "^0.3.2"
pydantic = "^2.7.2"
sphinx-autobuild = "^2024.10.3"
myst-parser = "^4.0.1"
bump-my-version = "^1.5.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


# Rememeber to add --tags when publishing a new version
# git push origin main --tags

# Commands to update versioning
# poetry run bump-my-version bump patch
# poetry run bump-my-version bump minor
# poetry run bump-my-version bump major

