name: Test and publish package to PyPI

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.installation.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
        installation:
          - name: numpy
            package: '.'
            pytest_args: ''
          - name: numba
            package: '.[numba]'
            pytest_args: '--require-backend=numba'
          - name: jax
            package: '.[jax]'
            pytest_args: '--require-backend=jax'
        # Check both supported Python boundaries without multiplying every job.
        include:
          - os: ubuntu-latest
            python: '3.11'
            installation:
              name: numpy
              package: '.'
              pytest_args: ''
          - os: ubuntu-latest
            python: '3.13'
            installation:
              name: numpy
              package: '.'
              pytest_args: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python }}

      - name: Install package and test dependencies
        run: python -m pip install "${{ matrix.installation.package }}" pytest

      - name: Check installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -I "${{ github.workspace }}/tests/installation/check_installed_package.py" --backend ${{ matrix.installation.name }}

      - name: Run source tests with the requested backend required
        run: python -m pytest ${{ matrix.installation.pytest_args }}

  combined_extras:
    name: Installed wheel with Numba and JAX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'

      - name: Build the wheel
        run: python -m pip wheel . --no-deps --wheel-dir wheelhouse

      - name: Install both optional extras from the wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          wheel = next(Path("wheelhouse").glob("nurbspy-*.whl"))
          subprocess.check_call([
              sys.executable, "-m", "pip", "install", f"{wheel}[numba,jax]"
          ])
          PY

      - name: Smoke-check installed geometry and both extras
        working-directory: ${{ runner.temp }}
        run: python -I "${{ github.workspace }}/tests/installation/check_installed_package.py" --backend all

  publish_to_pypi:
    needs: [test, combined_extras]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: '2.1.4'

      - name: Install dependencies
        run: poetry install --only=main

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          poetry build
          poetry publish --username $TWINE_USERNAME --password $TWINE_PASSWORD
